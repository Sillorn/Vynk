# Install as /etc/nginx/http.d/vynk.conf after replacing the certificate paths
# and frontend root for the host. The backend must remain bound to loopback.
server {
    listen 80;
    listen [::]:80;
    server_name vynk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vynk.example.com;

    ssl_certificate     /etc/ssl/vynk/fullchain.pem;
    ssl_certificate_key /etc/ssl/vynk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VynkTLS:10m;
    ssl_session_timeout 1d;

    root /var/www/vynk;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # API and authentication/session cookies stay same-origin. Do not cache
    # authenticated responses or proxy Spring's API documentation publicly.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # EventSource requests must not be buffered or given a short proxy timeout.
    location ^~ /api/v1/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-cache, no-store" always;
        add_header X-Accel-Buffering no always;
    }

    location = /v3/api-docs { return 404; }
    location ^~ /v3/api-docs/ { return 404; }
    location ^~ /swagger-ui { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
