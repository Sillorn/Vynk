server:
  address: 127.0.0.1
  port: 8080
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: vynk

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
